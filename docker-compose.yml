services:
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    environment:
      MANO_ASSETS_ROOT: /app/assets/mano
      CORS_ALLOW_ORIGINS: http://localhost:3000
    ports:
      - "8000:8000"
    volumes:
      - ./assets/mano:/app/assets/mano:ro

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    ports:
      - "3000:80"
    depends_on:
      - backend

